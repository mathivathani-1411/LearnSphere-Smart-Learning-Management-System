<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login – LearnHub LMS</title>
    <meta name="description" content="Sign in to your LearnHub LMS account." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/style.css" />
    <style>
        body { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
        .auth-container {
            width: 100%; max-width: 440px; padding: 1rem;
        }
        .auth-card {
            background: var(--bg-secondary);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-lg); padding: 2.5rem;
            box-shadow: var(--shadow-card);
        }
        .auth-logo {
            text-align: center; margin-bottom: 2rem;
        }
        .auth-logo .logo-icon {
            width: 56px; height: 56px; border-radius: 16px;
            background: linear-gradient(135deg, var(--accent), #a855f7);
            display: flex; align-items: center; justify-content: center;
            font-size: 1.75rem; margin: 0 auto 0.75rem;
        }
        .auth-logo h1 { font-size: 1.5rem; }
        .auth-logo p  { color: var(--text-muted); font-size: .875rem; margin-top: .25rem; }
        .divider {
            text-align: center; color: var(--text-muted); font-size: .8rem;
            margin: 1.25rem 0; position: relative;
        }
        .divider::before, .divider::after {
            content: ''; position: absolute; top: 50%; width: 42%;
            height: 1px; background: var(--glass-border);
        }
        .divider::before { left: 0; }
        .divider::after  { right: 0; }
        .auth-footer { text-align: center; margin-top: 1.25rem; color: var(--text-muted); font-size: .875rem; }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-logo">
                <div class="logo-icon">🎓</div>
                <h1>Welcome back</h1>
                <p>Sign in to your account</p>
            </div>

            <div id="alert-box"></div>

            <form id="login-form" novalidate>
                <div class="form-group">
                    <label class="form-label" for="email">Email address</label>
                    <input id="email" type="email" class="form-control" placeholder="you@example.com" autocomplete="email" required />
                </div>
                <div class="form-group">
                    <label class="form-label" for="password">
                        Password
                        <a href="#" style="float:right;font-size:.75rem;color:var(--accent-light)">Forgot password?</a>
                    </label>
                    <input id="password" type="password" class="form-control" placeholder="••••••••" autocomplete="current-password" required />
                </div>

                <button type="submit" id="submit-btn" class="btn btn-primary btn-full" style="margin-top:.5rem">
                    Sign In
                </button>
            </form>

            <div class="divider">or</div>

            <div class="auth-footer">
                Don't have an account?
                <a href="register.html" style="color:var(--accent-light);font-weight:600">Create one</a>
            </div>
        </div>
        <div style="text-align:center;margin-top:1rem">
            <a href="index.html" style="color:var(--text-muted);font-size:.8rem">← Back to home</a>
        </div>
    </div>

    <script src="js/app.js"></script>
    <script>
        // Redirect if already logged in
        (function () {
            const u = Auth.getUser();
            if (u) {
                location.href = u.role === 'STUDENT'
                    ? '/lms/student/dashboard.html'
                    : '/lms/instructor/dashboard.html';
            }
        })();

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn   = document.getElementById('submit-btn');
            const email = document.getElementById('email').value.trim();
            const pass  = document.getElementById('password').value;

            if (!email || !pass) {
                UI.showAlert('alert-box', 'Please enter your email and password.');
                return;
            }

            UI.setButtonLoading(btn, true);
            try {
                const data = await API.post('/api/auth/login', { email, password: pass });
                Auth.setUser({ role: data.role, name: data.name, userId: data.userId });
                UI.toast('Welcome back, ' + data.name + '! 🎉', 'success');
                setTimeout(() => {
                    location.href = data.role === 'STUDENT'
                        ? '/lms/student/dashboard.html'
                        : '/lms/instructor/dashboard.html';
                }, 600);
            } catch (err) {
                UI.showAlert('alert-box', err.message || 'Login failed. Please try again.');
            } finally {
                UI.setButtonLoading(btn, false);
            }
        });
    </script>
</body>
</html>
