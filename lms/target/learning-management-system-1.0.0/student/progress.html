<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Progress – LearnHub LMS</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../css/style.css" />
</head>
<body>
    <nav class="navbar">
        <a class="navbar-brand" href="../index.html"><div class="logo-icon">🎓</div> LearnHub LMS</a>
        <ul class="navbar-nav">
            <li><span id="user-name" style="color:var(--text-secondary);font-size:.875rem"></span></li>
            <li><a class="nav-link" href="notifications.html">🔔<span class="nav-badge hidden" id="notif-badge">0</span></a></li>
            <li><button class="btn btn-secondary btn-sm" onclick="logout()">Logout</button></li>
        </ul>
    </nav>
    <div class="app-layout">
        <aside class="sidebar">
            <div class="sidebar-section">
                <div class="sidebar-label">Main</div>
                <a class="sidebar-link" href="dashboard.html"><span class="icon">🏠</span> Dashboard</a>
                <a class="sidebar-link" href="courses.html"><span class="icon">📚</span> Course Catalogue</a>
                <a class="sidebar-link" href="my-courses.html"><span class="icon">🎒</span> My Courses</a>
            </div>
            <div class="sidebar-section">
                <div class="sidebar-label">Learning</div>
                <a class="sidebar-link" href="assignments.html"><span class="icon">📝</span> Assignments</a>
                <a class="sidebar-link" href="grades.html"><span class="icon">⭐</span> Grades</a>
                <a class="sidebar-link active" href="progress.html"><span class="icon">📊</span> My Progress</a>
            </div>
        </aside>
        <main class="main-content">
            <div class="section-header">
                <div>
                    <h1 class="page-title">My Learning Progress</h1>
                    <p class="page-subtitle">Track how far you've come in each course.</p>
                </div>
            </div>
            <div id="progress-container">
                <div class="spinner" style="margin:3rem auto"></div>
            </div>
        </main>
    </div>
    <script src="../js/app.js"></script>
    <script>
        if (!Auth.requireAuth('STUDENT')) throw new Error();
        document.getElementById('user-name').textContent = '👤 ' + Auth.getUser().name;

        async function loadProgress() {
            try {
                const progress = await API.get('/api/progress/me');
                const container = document.getElementById('progress-container');
                if (progress.length === 0) {
                    container.innerHTML = UI.emptyState('📊', 'No progress yet', 'Complete some lessons to see your progress!');
                    return;
                }

                const avgPct = (progress.reduce((s,p) => s + p.percentage, 0) / progress.length).toFixed(1);
                const completed = progress.filter(p => p.percentage >= 100).length;

                container.innerHTML = `
                    <!-- Overview stats -->
                    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:1rem;margin-bottom:2rem">
                        <div class="stat-card accent">
                            <div class="stat-icon">📚</div>
                            <div class="stat-value">${progress.length}</div>
                            <div class="stat-label">Courses Tracked</div>
                        </div>
                        <div class="stat-card success">
                            <div class="stat-icon">✅</div>
                            <div class="stat-value">${completed}</div>
                            <div class="stat-label">Completed Courses</div>
                        </div>
                        <div class="stat-card info">
                            <div class="stat-icon">📈</div>
                            <div class="stat-value">${avgPct}%</div>
                            <div class="stat-label">Average Progress</div>
                        </div>
                    </div>

                    <!-- Per-course cards -->
                    <div class="card-grid">
                        ${progress.map(p => {
                            const colour = p.percentage >= 100 ? 'success' : p.percentage >= 50 ? 'accent' : 'warning';
                            return `
                                <div class="card">
                                    <div style="margin-bottom:.75rem">
                                        <div style="font-weight:700;font-size:1rem;color:var(--text-primary);margin-bottom:.25rem">
                                            ${p.courseTitle}
                                        </div>
                                        ${p.percentage >= 100
                                            ? UI.badge('COMPLETED','success')
                                            : UI.badge('IN PROGRESS','accent')}
                                    </div>
                                    <div style="display:flex;justify-content:space-between;font-size:.8rem;color:var(--text-muted);margin-bottom:.5rem">
                                        <span>${p.completedLessons} / ${p.totalLessons} lessons</span>
                                        <span style="font-weight:700;color:var(--text-primary)">${p.percentage.toFixed(0)}%</span>
                                    </div>
                                    ${UI.progressBar(p.percentage)}
                                    <div class="text-xs text-muted mt-2">
                                        Last updated: ${UI.formatDateTime(p.lastUpdated)}
                                    </div>
                                </div>
                            `;
                        }).join('')}
                    </div>
                `;
            } catch (err) {
                document.getElementById('progress-container').innerHTML =
                    UI.emptyState('😕', 'Failed to load progress', err.message);
            }
        }

        loadProgress();
        loadNotificationCount();
    </script>
</body>
</html>
