<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Course Catalogue – LearnHub LMS</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../css/style.css" />
    <style>
        .search-bar {
            display: flex; gap: 1rem; margin-bottom: 1.5rem; align-items: center;
        }
        .search-bar input { flex: 1; }
    </style>
</head>
<body>
    <nav class="navbar">
        <a class="navbar-brand" href="../index.html"><div class="logo-icon">🎓</div> LearnHub LMS</a>
        <ul class="navbar-nav">
            <li><span id="user-name" style="color:var(--text-secondary);font-size:.875rem"></span></li>
            <li><a class="nav-link" href="notifications.html">🔔 <span class="nav-badge hidden" id="notif-badge">0</span></a></li>
            <li><button class="btn btn-secondary btn-sm" onclick="logout()">Logout</button></li>
        </ul>
    </nav>

    <div class="app-layout">
        <aside class="sidebar">
            <div class="sidebar-section">
                <div class="sidebar-label">Main</div>
                <a class="sidebar-link" href="dashboard.html"><span class="icon">🏠</span> Dashboard</a>
                <a class="sidebar-link active" href="courses.html"><span class="icon">📚</span> Course Catalogue</a>
                <a class="sidebar-link" href="my-courses.html"><span class="icon">🎒</span> My Courses</a>
            </div>
            <div class="sidebar-section">
                <div class="sidebar-label">Learning</div>
                <a class="sidebar-link" href="assignments.html"><span class="icon">📝</span> Assignments</a>
                <a class="sidebar-link" href="grades.html"><span class="icon">⭐</span> Grades</a>
                <a class="sidebar-link" href="progress.html"><span class="icon">📊</span> My Progress</a>
            </div>
        </aside>

        <main class="main-content">
            <div class="section-header">
                <div>
                    <h1 class="page-title">Course Catalogue</h1>
                    <p class="page-subtitle">Explore all available courses and enroll instantly.</p>
                </div>
            </div>

            <div class="search-bar">
                <input type="text" id="search" class="form-control" placeholder="🔍  Search courses…" />
            </div>

            <div id="alert-box"></div>
            <div id="courses-grid" class="card-grid">
                <div class="spinner" style="margin:3rem auto;grid-column:1/-1"></div>
            </div>
        </main>
    </div>

    <!-- Enroll Confirmation Modal -->
    <div id="enroll-modal" class="modal-overlay hidden">
        <div class="modal">
            <div class="modal-header">
                <h3>Enroll in Course</h3>
                <button class="modal-close" onclick="closeModal()">✕</button>
            </div>
            <p style="color:var(--text-secondary);margin-bottom:1.5rem">
                You are about to enroll in <strong id="modal-course-title"></strong>. Confirm?
            </p>
            <div style="display:flex;gap:.75rem;justify-content:flex-end">
                <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
                <button class="btn btn-primary" id="confirm-enroll-btn" onclick="confirmEnroll()">Enroll Now</button>
            </div>
        </div>
    </div>

    <script src="../js/app.js"></script>
    <script>
        if (!Auth.requireAuth('STUDENT')) throw new Error();
        document.getElementById('user-name').textContent = '👤 ' + Auth.getUser().name;

        let allCourses = [];
        let pendingCourseId = null;
        let enrolledIds = new Set();

        const BANNERS = ['🌟','📐','🧮','🔬','💻','🎨','📖','🌍','🏛️','🎵'];

        async function loadCourses() {
            try {
                const [courses, enrollments] = await Promise.all([
                    API.get('/api/courses'),
                    API.get('/api/enrollments/me')
                ]);
                allCourses = courses;
                enrolledIds = new Set(enrollments.map(e => e.courseId));
                renderCourses(courses);
            } catch (err) {
                document.getElementById('courses-grid').innerHTML =
                    UI.emptyState('😕', 'Failed to load courses', err.message);
            }
        }

        function renderCourses(courses) {
            const grid = document.getElementById('courses-grid');
            if (courses.length === 0) {
                grid.innerHTML = UI.emptyState('📚', 'No courses found', 'Try a different search term.');
                return;
            }
            grid.innerHTML = courses.map((c, i) => {
                const enrolled = enrolledIds.has(c.courseId);
                return `
                    <div class="course-card">
                        <div class="course-card-banner" style="background:linear-gradient(135deg,
                            hsl(${(i*47)%360},60%,30%), hsl(${(i*47+60)%360},70%,25%))">
                            ${BANNERS[i % BANNERS.length]}
                        </div>
                        <div class="course-card-body">
                            <div class="course-card-title">${c.title}</div>
                            <div class="course-card-meta">👤 ${c.instructorName || 'Instructor'}</div>
                            <div style="margin-top:1rem;display:flex;justify-content:space-between;align-items:center">
                                ${enrolled
                                    ? `<span class="badge badge-success">✓ Enrolled</span>
                                       <a href="my-courses.html" class="btn btn-secondary btn-sm">Go to Course</a>`
                                    : `<span class="badge badge-accent">Open</span>
                                       <button class="btn btn-primary btn-sm"
                                           onclick="openEnrollModal(${c.courseId},'${c.title.replace(/'/g,"\\'")}')">
                                           Enroll Free
                                       </button>`
                                }
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // Search
        document.getElementById('search').addEventListener('input', function () {
            const q = this.value.toLowerCase();
            renderCourses(allCourses.filter(c =>
                c.title.toLowerCase().includes(q) ||
                (c.description || '').toLowerCase().includes(q) ||
                (c.instructorName || '').toLowerCase().includes(q)
            ));
        });

        function openEnrollModal(courseId, title) {
            pendingCourseId = courseId;
            document.getElementById('modal-course-title').textContent = title;
            document.getElementById('enroll-modal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('enroll-modal').classList.add('hidden');
            pendingCourseId = null;
        }

        async function confirmEnroll() {
            if (!pendingCourseId) return;
            const btn = document.getElementById('confirm-enroll-btn');
            UI.setButtonLoading(btn, true);
            try {
                await API.post(`/api/courses/${pendingCourseId}/enroll`);
                enrolledIds.add(pendingCourseId);
                renderCourses(allCourses);
                closeModal();
                UI.toast('🎉 Successfully enrolled!', 'success');
            } catch (err) {
                UI.showAlert('alert-box', err.message, 'danger');
                closeModal();
            } finally {
                UI.setButtonLoading(btn, false);
            }
        }

        loadCourses();
        loadNotificationCount();
    </script>
</body>
</html>
