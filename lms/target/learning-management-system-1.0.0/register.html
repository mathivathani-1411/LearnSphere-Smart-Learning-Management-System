<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register – LearnHub LMS</title>
    <meta name="description" content="Create your free LearnHub LMS account." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/style.css" />
    <style>
        body { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 2rem 1rem; }
        .auth-container { width: 100%; max-width: 480px; }
        .auth-card {
            background: var(--bg-secondary); border: 1px solid var(--glass-border);
            border-radius: var(--radius-lg); padding: 2.5rem; box-shadow: var(--shadow-card);
        }
        .auth-logo { text-align: center; margin-bottom: 2rem; }
        .auth-logo .logo-icon {
            width: 56px; height: 56px; border-radius: 16px;
            background: linear-gradient(135deg, var(--accent), #a855f7);
            display: flex; align-items: center; justify-content: center;
            font-size: 1.75rem; margin: 0 auto 0.75rem;
        }
        .role-toggle { display: grid; grid-template-columns: 1fr 1fr; gap: .5rem; margin-bottom: 1.5rem; }
        .role-btn {
            padding: .75rem; border-radius: var(--radius-sm); border: 1px solid var(--glass-border);
            background: var(--bg-card); color: var(--text-secondary); cursor: pointer;
            font-family: inherit; font-size: .875rem; font-weight: 500;
            transition: all var(--transition); text-align: center;
        }
        .role-btn.selected {
            background: rgba(108,99,255,.15); border-color: var(--accent);
            color: var(--accent-light);
        }
        .role-btn .role-icon { font-size: 1.5rem; display: block; margin-bottom: .3rem; }
        .strength-bar {
            height: 4px; border-radius: 2px; background: rgba(255,255,255,.08);
            margin-top: .4rem; overflow: hidden;
        }
        .strength-bar-fill { height: 100%; border-radius: 2px; transition: all .3s; }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-logo">
                <div class="logo-icon">🎓</div>
                <h1 style="font-size:1.5rem">Create your account</h1>
                <p style="color:var(--text-muted);font-size:.875rem;margin-top:.25rem">Start learning today — it's free!</p>
            </div>

            <div id="alert-box"></div>

            <!-- Role selector -->
            <div class="form-group">
                <label class="form-label">I am a…</label>
                <div class="role-toggle">
                    <button type="button" class="role-btn selected" id="role-student" onclick="selectRole('STUDENT')">
                        <span class="role-icon">🎒</span> Student
                    </button>
                    <button type="button" class="role-btn" id="role-instructor" onclick="selectRole('INSTRUCTOR')">
                        <span class="role-icon">👩‍🏫</span> Instructor
                    </button>
                </div>
            </div>
            <input type="hidden" id="role" value="STUDENT" />

            <form id="register-form" novalidate>
                <div class="form-group">
                    <label class="form-label" for="name">Full Name</label>
                    <input id="name" type="text" class="form-control" placeholder="Alice Johnson" autocomplete="name" required />
                </div>
                <div class="form-group">
                    <label class="form-label" for="email">Email address</label>
                    <input id="email" type="email" class="form-control" placeholder="you@example.com" autocomplete="email" required />
                </div>
                <div class="form-group">
                    <label class="form-label" for="password">Password</label>
                    <input id="password" type="password" class="form-control" placeholder="At least 6 characters" autocomplete="new-password" required />
                    <div class="strength-bar mt-1"><div class="strength-bar-fill" id="strength-fill"></div></div>
                    <span id="strength-text" class="text-xs text-muted mt-1" style="display:block"></span>
                </div>
                <div class="form-group">
                    <label class="form-label" for="confirm-password">Confirm Password</label>
                    <input id="confirm-password" type="password" class="form-control" placeholder="Repeat password" autocomplete="new-password" required />
                </div>

                <button type="submit" id="submit-btn" class="btn btn-primary btn-full" style="margin-top:.5rem">
                    Create Account
                </button>
            </form>

            <div style="text-align:center;margin-top:1.25rem;color:var(--text-muted);font-size:.875rem">
                Already have an account?
                <a href="login.html" style="color:var(--accent-light);font-weight:600">Sign in</a>
            </div>
        </div>
        <div style="text-align:center;margin-top:1rem">
            <a href="index.html" style="color:var(--text-muted);font-size:.8rem">← Back to home</a>
        </div>
    </div>

    <script src="js/app.js"></script>
    <script>
        let selectedRole = 'STUDENT';

        function selectRole(role) {
            selectedRole = role;
            document.getElementById('role-student').classList.toggle('selected', role === 'STUDENT');
            document.getElementById('role-instructor').classList.toggle('selected', role === 'INSTRUCTOR');
        }

        // Password strength meter
        document.getElementById('password').addEventListener('input', function () {
            const val = this.value;
            const fill = document.getElementById('strength-fill');
            const text = document.getElementById('strength-text');
            let score = 0;
            if (val.length >= 6)  score++;
            if (val.length >= 10) score++;
            if (/[A-Z]/.test(val)) score++;
            if (/[0-9]/.test(val)) score++;
            if (/[^A-Za-z0-9]/.test(val)) score++;
            const colours = ['#ef4444','#f59e0b','#eab308','#22c55e','#22c55e'];
            const labels  = ['','Weak','Fair','Good','Strong'];
            fill.style.width = (score * 20) + '%';
            fill.style.background = colours[score] || '';
            text.textContent = labels[score] || '';
        });

        document.getElementById('register-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn      = document.getElementById('submit-btn');
            const name     = document.getElementById('name').value.trim();
            const email    = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const confirm  = document.getElementById('confirm-password').value;

            if (!name || !email || !password) {
                UI.showAlert('alert-box', 'All fields are required.'); return;
            }
            if (password.length < 6) {
                UI.showAlert('alert-box', 'Password must be at least 6 characters.'); return;
            }
            if (password !== confirm) {
                UI.showAlert('alert-box', 'Passwords do not match.'); return;
            }

            UI.setButtonLoading(btn, true);
            try {
                const data = await API.post('/api/auth/register', { name, email, password, role: selectedRole });
                Auth.setUser({ role: data.role, name: data.name });
                UI.toast('Account created! Welcome, ' + data.name + ' 🎉', 'success');
                setTimeout(() => {
                    location.href = data.role === 'STUDENT'
                        ? '/lms/student/dashboard.html'
                        : '/lms/instructor/dashboard.html';
                }, 800);
            } catch (err) {
                UI.showAlert('alert-box', err.message || 'Registration failed.');
            } finally {
                UI.setButtonLoading(btn, false);
            }
        });
    </script>
</body>
</html>
