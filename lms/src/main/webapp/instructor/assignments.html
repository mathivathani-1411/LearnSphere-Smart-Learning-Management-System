<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Manage Assignments – LearnHub LMS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../css/style.css" />
</head>
<body>
    <nav class="navbar">
        <a class="navbar-brand" href="../index.html"><div class="logo-icon">👩‍🏫</div> LearnHub LMS</a>
        <ul class="navbar-nav">
            <li><span id="user-name" style="color:var(--text-secondary);font-size:.875rem"></span></li>
            <li><a class="nav-link" href="notifications.html">🔔 <span class="nav-badge hidden" id="notif-badge">0</span></a></li>
            <li><button class="btn btn-secondary btn-sm" onclick="logout()">Logout</button></li>
        </ul>
    </nav>

    <div class="app-layout">
        <aside class="sidebar">
            <div class="sidebar-section">
                <div class="sidebar-label">Instructor Portal</div>
                <a class="sidebar-link" href="dashboard.html"><span class="icon">🏠</span> Dashboard</a>
                <a class="sidebar-link" href="courses.html"><span class="icon">📚</span> Manage Courses</a>
                <a class="sidebar-link active" href="assignments.html"><span class="icon">📝</span> Assignments</a>
                <a class="sidebar-link" href="submissions.html"><span class="icon">⭐</span> Grade Submissions</a>
            </div>
            <div class="sidebar-section">
                <div class="sidebar-label">Account</div>
                <a class="sidebar-link" href="notifications.html"><span class="icon">🔔</span> Notifications</a>
            </div>
        </aside>

        <main class="main-content">
            <div class="section-header">
                <div>
                    <h1 class="page-title">Course Assignments</h1>
                    <p class="page-subtitle">Publish coursework, set due dates, and monitor student submissions.</p>
                </div>
                <button class="btn btn-primary" onclick="openCreateAssignmentModal()">+ Create Assignment</button>
            </div>

            <div id="alert-box"></div>
            <div id="assignments-table-container">
                <div class="spinner" style="margin:3rem auto"></div>
            </div>
        </main>
    </div>

    <!-- Create Assignment Modal -->
    <div id="create-asg-modal" class="modal-overlay hidden">
        <div class="modal" style="max-width:550px">
            <div class="modal-header">
                <h3>Create New Assignment</h3>
                <button class="modal-close" onclick="closeCreateAssignmentModal()">✕</button>
            </div>
            <form onsubmit="handleCreateAssignment(event)">
                <div class="form-group">
                    <label class="form-label">Course</label>
                    <select id="asg-course-select" class="form-control" required>
                        <option value="">-- Choose Course --</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label">Assignment Title</label>
                    <input id="asg-title" class="form-control" placeholder="e.g. Build REST API for LMS" required />
                </div>
                <div class="form-group">
                    <label class="form-label">Instructions / Description</label>
                    <textarea id="asg-desc" class="form-control" rows="3" placeholder="Provide assignment requirements and submission criteria..."></textarea>
                </div>
                <div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem">
                    <div class="form-group">
                        <label class="form-label">Submission Deadline</label>
                        <input type="datetime-local" id="asg-deadline" class="form-control" required />
                    </div>
                    <div class="form-group">
                        <label class="form-label">Max Marks</label>
                        <input type="number" id="asg-max-marks" class="form-control" value="100" min="1" max="1000" required />
                    </div>
                </div>
                <div class="form-group" style="display:flex;align-items:center;gap:.6rem;margin-top:.5rem">
                    <input type="checkbox" id="asg-allow-late" style="width:18px;height:18px;cursor:pointer" />
                    <label for="asg-allow-late" style="color:var(--text-secondary);font-size:.9rem;cursor:pointer">Allow late submissions after deadline</label>
                </div>
                <div style="display:flex;gap:.75rem;justify-content:flex-end;margin-top:1.5rem">
                    <button type="button" class="btn btn-secondary" onclick="closeCreateAssignmentModal()">Cancel</button>
                    <button type="submit" class="btn btn-primary" id="save-asg-btn">Publish Assignment</button>
                </div>
            </form>
        </div>
    </div>

    <script src="../js/app.js"></script>
    <script>
        if (!Auth.requireAuth('INSTRUCTOR')) throw new Error();
        document.getElementById('user-name').textContent = '👩‍🏫 ' + Auth.getUser().name;

        let instructorCourses = [];

        async function init() {
            try {
                instructorCourses = await API.get('/api/courses/instructor');
                const select = document.getElementById('asg-course-select');
                select.innerHTML = '<option value="">-- Choose Course --</option>' +
                    instructorCourses.map(c => `<option value="${c.courseId}">${c.title}</option>`).join('');

                loadAllAssignments();
            } catch (err) {
                document.getElementById('assignments-table-container').innerHTML =
                    UI.emptyState('😕', 'Failed to load assignments', err.message);
            }
        }

        async function loadAllAssignments() {
            const container = document.getElementById('assignments-table-container');
            container.innerHTML = '<div class="spinner" style="margin:3rem auto"></div>';

            try {
                let allAssignments = [];
                for (const c of instructorCourses) {
                    try {
                        const asgs = await API.get(`/api/courses/${c.courseId}/assignments`);
                        allAssignments.push(...asgs.map(a => ({ ...a, courseTitle: c.title })));
                    } catch (_) {}
                }

                if (allAssignments.length === 0) {
                    container.innerHTML = UI.emptyState('📝', 'No assignments created', 'Click "Create Assignment" to assign coursework to your enrolled students.');
                    return;
                }

                container.innerHTML = `
                    <div class="table-container">
                        <table>
                            <thead>
                                <tr>
                                    <th>Assignment Title</th>
                                    <th>Course</th>
                                    <th>Deadline</th>
                                    <th>Max Marks</th>
                                    <th>Late Allowed</th>
                                    <th>Action</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${allAssignments.map(a => `
                                    <tr>
                                        <td style="color:var(--text-primary);font-weight:600">${a.title}</td>
                                        <td>${a.courseTitle}</td>
                                        <td>${UI.formatDateTime(a.deadline)}</td>
                                        <td>${a.maxMarks}</td>
                                        <td>${a.allowLate ? '<span class="badge badge-success">YES</span>' : '<span class="badge badge-muted">NO</span>'}</td>
                                        <td>
                                            <a href="submissions.html?asgId=${a.assignmentId}" class="btn btn-primary btn-sm">
                                                Review Submissions →
                                            </a>
                                        </td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    </div>
                `;
            } catch (err) {
                container.innerHTML = `<p class="alert alert-danger">${err.message}</p>`;
            }
        }

        function openCreateAssignmentModal() {
            // Default deadline: 7 days from now
            const now = new Date();
            now.setDate(now.getDate() + 7);
            const iso = now.toISOString().slice(0, 16);
            document.getElementById('asg-deadline').value = iso;
            document.getElementById('create-asg-modal').classList.remove('hidden');
        }

        function closeCreateAssignmentModal() {
            document.getElementById('create-asg-modal').classList.add('hidden');
        }

        async function handleCreateAssignment(e) {
            e.preventDefault();
            const courseId = document.getElementById('asg-course-select').value;
            const title = document.getElementById('asg-title').value.trim();
            const description = document.getElementById('asg-desc').value.trim();
            const deadline = document.getElementById('asg-deadline').value;
            const maxMarks = parseInt(document.getElementById('asg-max-marks').value, 10);
            const allowLate = document.getElementById('asg-allow-late').checked;
            const btn = document.getElementById('save-asg-btn');

            if (!courseId) {
                alert('Please choose a course.'); return;
            }

            UI.setButtonLoading(btn, true);
            try {
                await API.post(`/api/courses/${courseId}/assignments`, {
                    title, description, deadline, maxMarks, allowLate
                });
                UI.toast('Assignment created successfully! 📝', 'success');
                closeCreateAssignmentModal();
                loadAllAssignments();
            } catch (err) {
                UI.toast(err.message, 'danger');
            } finally {
                UI.setButtonLoading(btn, false);
            }
        }

        init();
        loadNotificationCount();
    </script>
</body>
</html>
