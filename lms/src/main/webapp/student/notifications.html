<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Notifications – LearnHub LMS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../css/style.css" />
</head>
<body>
    <nav class="navbar">
        <a class="navbar-brand" href="../index.html"><div class="logo-icon">🎓</div> LearnHub LMS</a>
        <ul class="navbar-nav">
            <li><span id="user-name" style="color:var(--text-secondary);font-size:.875rem"></span></li>
            <li><button class="btn btn-secondary btn-sm" onclick="logout()">Logout</button></li>
        </ul>
    </nav>

    <div class="app-layout">
        <aside class="sidebar">
            <div class="sidebar-section">
                <div class="sidebar-label">Main</div>
                <a class="sidebar-link" href="dashboard.html"><span class="icon">🏠</span> Dashboard</a>
                <a class="sidebar-link" href="courses.html"><span class="icon">📚</span> Course Catalogue</a>
                <a class="sidebar-link" href="my-courses.html"><span class="icon">🎒</span> My Courses</a>
            </div>
            <div class="sidebar-section">
                <div class="sidebar-label">Learning</div>
                <a class="sidebar-link" href="assignments.html"><span class="icon">📝</span> Assignments</a>
                <a class="sidebar-link" href="grades.html"><span class="icon">⭐</span> Grades</a>
                <a class="sidebar-link" href="progress.html"><span class="icon">📊</span> My Progress</a>
            </div>
            <div class="sidebar-section">
                <div class="sidebar-label">Account</div>
                <a class="sidebar-link active" href="notifications.html"><span class="icon">🔔</span> Notifications</a>
            </div>
        </aside>

        <main class="main-content">
            <div class="section-header">
                <div>
                    <h1 class="page-title">Notifications</h1>
                    <p class="page-subtitle">Stay informed about your coursework, submissions, and grades.</p>
                </div>
                <button class="btn btn-secondary btn-sm" id="btn-mark-all" onclick="markAllRead()">
                    ✓ Mark all as read
                </button>
            </div>

            <div id="notifications-container">
                <div class="spinner" style="margin:3rem auto"></div>
            </div>
        </main>
    </div>

    <script src="../js/app.js"></script>
    <script>
        if (!Auth.requireAuth('STUDENT')) throw new Error();
        document.getElementById('user-name').textContent = '👤 ' + Auth.getUser().name;

        async function loadNotifications() {
            try {
                const notifications = await API.get('/api/notifications');
                const container = document.getElementById('notifications-container');

                if (notifications.length === 0) {
                    container.innerHTML = UI.emptyState('🔔', 'No notifications yet', 'When your assignments are graded or new announcements occur, they will appear here.');
                    return;
                }

                container.innerHTML = notifications.map(n => `
                    <div class="notification-item ${n.read ? 'read' : 'unread'}" style="margin-bottom:.75rem">
                        <div class="notif-dot" style="${n.read ? 'opacity:0' : ''}"></div>
                        <div style="flex:1">
                            <div style="color:var(--text-primary);font-size:.92rem;margin-bottom:.25rem">
                                ${n.link ? `<a href="${n.link}" style="color:var(--text-primary)">${n.message}</a>` : n.message}
                            </div>
                            <div class="text-xs text-muted">${UI.formatDateTime(n.createdAt)}</div>
                        </div>
                    </div>
                `).join('');
            } catch (err) {
                document.getElementById('notifications-container').innerHTML =
                    UI.emptyState('😕', 'Failed to load notifications', err.message);
            }
        }

        async function markAllRead() {
            try {
                await API.post('/api/notifications/read');
                UI.toast('All marked as read', 'success');
                loadNotifications();
            } catch (err) {
                UI.toast(err.message, 'danger');
            }
        }

        loadNotifications();
    </script>
</body>
</html>
